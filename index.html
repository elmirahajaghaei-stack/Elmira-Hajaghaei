<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#118c86"><meta name="description" content="LUMA — digital mental health platform"><title>LUMA</title><style>
:root{--teal:#118c86;--deep:#123d3a;--mint:#eef9f7;--line:#d9e8e5;--muted:#657c79;--danger:#b42318;--amber:#a66b00}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#edf5f4;color:var(--deep);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}.app{max-width:560px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 35px #0000000b}.top{position:sticky;top:0;z-index:20;background:#fffffff5;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:27px;font-weight:950;letter-spacing:3px;color:var(--teal)}.actions{display:flex;gap:7px}.icon{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;cursor:pointer}.main{padding:12px 0 95px}.card{margin:12px 16px;padding:18px;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 8px 28px #173d3a0b}.hero{background:linear-gradient(145deg,#eefaf8,#fff)}h1{font-size:24px;margin:2px 0 9px}h2{font-size:18px;margin:5px 0}.p{color:var(--muted);line-height:1.8}.small{font-size:12px;color:var(--muted);line-height:1.7}.btn{width:100%;border:0;border-radius:14px;padding:13px 15px;margin-top:9px;background:var(--teal);color:#fff;cursor:pointer;font-weight:700}.btn.ghost{background:#fff;color:var(--teal);border:1px solid var(--teal)}.btn.danger{background:#fff1f1;color:var(--danger);border:1px solid #efc7c3}.input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;margin:6px 0;background:#fff;color:var(--deep)}.label{display:block;font-weight:800;margin-top:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.chip{display:inline-block;background:var(--mint);color:var(--teal);border-radius:999px;padding:5px 9px;font-size:12px;margin:3px}.therapist{border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}.notice{padding:12px 14px;border-radius:14px;background:#fff8df;border:1px solid #f1dda0;margin:10px 0}.success{background:#effaf3;border-color:#bfe5ca}.dangerbox{background:#fff2f0;border-color:#f1c0ba}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--mint);padding:14px;border-radius:16px;text-align:center}.stat b{display:block;font-size:23px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);z-index:30;width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff7;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:transparent;color:#617572;padding:9px 2px 10px;font-size:11px;cursor:pointer}.nav b{display:block;font-size:18px}.nav .active{color:var(--teal);font-weight:900}.badge{background:#d92d20;color:#fff;border-radius:99px;padding:1px 5px;font-size:9px}.switch{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.largeText{font-size:18px}.highContrast{filter:contrast(1.3)}.focusMode *:focus{outline:4px solid #f0a400!important;outline-offset:2px}.hidden{display:none!important}.center{text-align:center}.loader{padding:30px;text-align:center;color:var(--muted)}@media(min-width:700px){.app{min-height:100vh}}
</style></head><body><div class="app"><header class="top"><div class="logo">LUMA</div><div class="actions"><button class="icon" id="langBtn" onclick="toggleLang()" aria-label="Change language">EN</button><button class="icon" onclick="voiceUI()" aria-label="Voice assistant">🎙️</button></div></header><main id="main" class="main"></main><nav id="nav" class="nav hidden" aria-label="Primary navigation"></nav></div>
<script>
const T={fa:{home:'خانه',find:'درمانگر',follow:'پیگیری',alerts:'اعلان‌ها',profile:'پروفایل',welcome:'به LUMA خوش آمدید',sub:'پلتفرم دیجیتال برای پیدا کردن، رزرو و ادامه‌دادن حمایت روان‌شناختی مناسب.',login:'ورود',signup:'ثبت‌نام',client:'مراجع',therapist:'درمانگر',name:'نام و نام خانوادگی',email:'ایمیل',pass:'رمز عبور',phone:'شماره موبایل',continue:'ادامه',chooseRole:'نوع حساب را انتخاب کنید',clientDesc:'ارزیابی اولیه، انتخاب درمانگر، رزرو و پیگیری بین جلسات.',therapistDesc:'پروفایل حرفه‌ای، دریافت مراجع، رزرو و پیگیری.',start:'پیدا کردن درمانگر مناسب',concern:'موضوع اصلی',distress:'شدت ناراحتی',lang:'زبان جلسه',mode:'نوع جلسه',gender:'جنسیت ترجیحی درمانگر',budget:'بودجه جلسه',goal:'هدف درمان',duration:'مدت/شروع مشکل',approach:'رویکرد ترجیحی',accessibility:'دسترسی‌پذیری',matches:'درمانگران پیشنهادی',matched:'بر اساس پاسخ‌های شما مرتب شده‌اند.',book:'رزرو جلسه',verified:'نمونه نمایشی',price:'هزینه',availability:'زمان‌های قابل رزرو',appointments:'رزروهای من',followTitle:'پیگیری بین جلسات',checkin:'چک‌این',mood:'حال ۰ تا ۱۰',stress:'استرس ۰ تا ۱۰',homework:'تکلیف',complete:'انجام شد',contact:'می‌خواهم درمانگر با من تماس بگیرد',notifications:'اعلان‌ها',noNotifications:'اعلان جدیدی ندارید.',journal:'دفتر حال',membership:'اشتراک',access:'دسترسی‌پذیری',deaf:'حالت ناشنوا/کم‌شنوا',blind:'حالت نابینا/کم‌بینا',captions:'اطلاعات و اعلان‌های متنی',large:'متن بزرگ',contrast:'کنتراست بالا',focus:'تمرکز کیبورد',read:'خواندن صفحه',voice:'دستیار صوتی',dashboard:'داشبورد درمانگر',clients:'مراجعان',alertsTitle:'هشدارهای پیگیری',green:'عادی',amber:'نیازمند پیگیری',red:'اولویت بررسی',logout:'خروج',back:'بازگشت',save:'ذخیره',privacy:'حریم خصوصی و رضایت',emergency:'LUMA جایگزین خدمات اورژانسی یا تشخیص حرفه‌ای نیست.',next:'مرحله بعد',none:'بدون ترجیح'},en:{home:'Home',find:'Therapists',follow:'Follow-up',alerts:'Alerts',profile:'Profile',welcome:'Welcome to LUMA',sub:'A digital platform for finding, booking and continuing appropriate psychological support.',login:'Log in',signup:'Create account',client:'Client',therapist:'Therapist',name:'Full name',email:'Email',pass:'Password',phone:'Mobile number',continue:'Continue',chooseRole:'Choose account type',clientDesc:'Intake, therapist matching, booking and between-session follow-up.',therapistDesc:'Professional profile, client acquisition, booking and follow-up.',start:'Find the right therapist',concern:'Main concern',distress:'Distress level',lang:'Session language',mode:'Session mode',gender:'Preferred therapist gender',budget:'Session budget',goal:'Treatment goal',duration:'Duration/onset',approach:'Preferred approach',accessibility:'Accessibility',matches:'Recommended therapists',matched:'Ranked using your preferences.',book:'Book session',verified:'Demo profile',price:'Fee',availability:'Available times',appointments:'My appointments',followTitle:'Between-session follow-up',checkin:'Check-in',mood:'Mood 0–10',stress:'Stress 0–10',homework:'Homework',complete:'Mark complete',contact:'I want my therapist to contact me',notifications:'Notifications',noNotifications:'No new notifications.',journal:'Mood journal',membership:'Membership',access:'Accessibility',deaf:'Deaf / hard-of-hearing mode',blind:'Blind / low-vision mode',captions:'Text information & alerts',large:'Large text',contrast:'High contrast',focus:'Keyboard focus',read:'Read page aloud',voice:'Voice assistant',dashboard:'Therapist dashboard',clients:'Clients',alertsTitle:'Follow-up alerts',green:'Routine',amber:'Follow-up recommended',red:'Priority review',logout:'Log out',back:'Back',save:'Save',privacy:'Privacy & consent',emergency:'LUMA does not replace emergency services or professional diagnosis.',next:'Next',none:'No preference'}};
let fa=true,role='',logged=false,access={deaf:false,blind:false,captions:true,large:false,contrast:false,focus:false};
const psychiatrists=[{name:{fa:'دکتر روانپزشک نمونه',en:'Demo Psychiatrist'},spec:{fa:'ارزیابی و درمان دارویی و روانپزشکی',en:'Psychiatric assessment and medication management'},langs:['فارسی','English'],modes:['online'],price:55,times:['11:00','17:00']}];
const specialists=[{name:{fa:'متخصص سلامت روان نمونه',en:'Demo Mental-Health Specialist'},spec:{fa:'استرس، خواب و مهارت‌های مقابله‌ای',en:'Stress, sleep and coping skills'},langs:['فارسی','English'],modes:['online'],price:30,times:['13:00','18:00']}];
const therapists=[{id:1,name:{fa:'دکتر المیرا حاج آقایی',en:'Dr. Elmira Haj Aghaei'},spec:{fa:'اضطراب • روابط • هویت و مهاجرت',en:'Anxiety • Relationships • Identity & Migration'},langs:['فارسی','English'],modes:['online'],price:45,times:['10:00','14:00','18:00']},{id:2,name:{fa:'دکتر سارا',en:'Dr. Sara'},spec:{fa:'افسردگی • اضطراب • استرس',en:'Depression • Anxiety • Stress'},langs:['فارسی','English'],modes:['online'],price:40,times:['09:00','16:00']},{id:3,name:{fa:'دکتر نیکا',en:'Dr. Nika'},spec:{fa:'روابط • هویت',en:'Relationships • Identity'},langs:['فارسی'],modes:['online','inperson'],price:35,times:['12:00','19:00']}];
const t=k=>T[fa?'fa':'en'][k]||k; const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(k,v){localStorage.setItem('luma_'+k,JSON.stringify(v))}function get(k,d){try{return JSON.parse(localStorage.getItem('luma_'+k))??d}catch{return d}}
function render(x){document.getElementById('main').innerHTML=x;document.documentElement.lang=fa?'fa':'en';document.documentElement.dir=fa?'rtl':'ltr';applyAccess()}
function nav(active){const n=document.getElementById('nav');n.classList.remove('hidden');const unread=get('notifications',[]).filter(x=>!x.read).length;n.innerHTML=`<button class="${active==='home'?'active':''}" onclick="home()"><b>⌂</b>${t('home')}</button><button class="${active==='find'?'active':''}" onclick="match()"><b>⌕</b>${t('find')}</button><button class="${active==='follow'?'active':''}" onclick="follow()"><b>✓</b>${t('follow')}</button><button class="${active==='alerts'?'active':''}" onclick="notifications()"><b>🔔 ${unread?'<span class=badge>'+unread+'</span>':''}</b>${t('alerts')}</button><button class="${active==='profile'?'active':''}" onclick="profile()"><b>◉</b>${t('profile')}</button>`}
function landing(){document.getElementById('nav').classList.add('hidden');render(`<section class="card hero center"><div class="logo" aria-label="LUMA">LUMA</div><h1>${fa?'متخصص مناسب را پیدا کنید':'Find the right mental-health professional'}</h1><p class="p">${fa?'LUMA به شما کمک می‌کند ابتدا با چند سؤال هدایت‌گر، نیاز روان‌شناختی خود را مشخص کنید و سپس روانشناس یا متخصص مناسب را پیدا و رزرو کنید.':'LUMA guides you through a brief screening, identifies your main needs, and then recommends suitable psychologists and mental-health professionals.'}</p><div class="notice success" role="note"><b>${fa?'پزشکان و متخصصان سلامت روان':'Mental-health professionals'}</b><p class="small">${fa?'روانشناسان، روانپزشکان و متخصصان سلامت روان (اطلاعات نمونه) بر اساس حوزه تخصص، زبان، زمان و نیاز شما معرفی می‌شوند.':'Psychologists, psychiatrists and mental-health specialists are recommended based on specialty, language, availability and your needs.'}</p></div><button class="btn" onclick="screeningStart()">${fa?'شروع ارزیابی هدایت‌گر':'Start guided screening'}</button><button class="btn ghost" onclick="auth('client','signup')">${t('signup')} — ${t('client')}</button><button class="btn ghost" onclick="auth('therapist','signup')">${t('signup')} — ${t('therapist')}</button><button class="btn ghost" onclick="auth('', 'login')">${t('login')}</button><button class="btn ghost" onclick="accessibility()">♿ ${t('access')}</button><button class="btn ghost" onclick="professionalDirectory()">${fa?'مشاهده متخصصان و روانشناسان':'Browse psychologists & specialists'}</button><p class="small">${t('privacy')} · ${t('emergency')}</p></section>`)}
function professionalDirectory(){document.getElementById('nav').classList.add('hidden');const all=[...therapists.map(x=>({...x,type:{fa:'روانشناس',en:'Psychologist'}})),...psychiatrists.map(x=>({...x,type:{fa:'روانپزشک',en:'Psychiatrist'}})),...specialists.map(x=>({...x,type:{fa:'متخصص سلامت روان',en:'Mental-health specialist'}}))];render(`<section class="card"><h1>${fa?'روانشناسان، روانپزشکان و متخصصان':'Psychologists, psychiatrists & specialists'}</h1><p class="p">${fa?'اطلاعات این بخش نمونه نمایشی است و به معنی تأیید مجوز حرفه‌ای نیست.':'Profiles shown here are demo data and do not represent professional-license verification.'}</p>${all.map(x=>`<div class="therapist"><h2>${esc(x.name[fa?'fa':'en'])}</h2><p><b>${esc(x.type[fa?'fa':'en'])}</b></p><p>${esc(x.spec[fa?'fa':'en'])}</p><span class="chip">${esc(x.langs.join(' • '))}</span><span class="chip">${fa?'نمونه نمایشی':'Demo profile'}</span><button class="btn" onclick="screeningStart()">${fa?'ارزیابی و انتخاب مناسب‌تر':'Screen & find the best match'}</button></div>`).join('')}<button class="btn ghost" onclick="landing()">${t('back')}</button></section>`)}
function screeningStart(){document.getElementById('nav').classList.add('hidden');let step=1;let a={};function draw(){let q=[
{key:'concern',title:fa?'بیشتر چه چیزی شما را به دریافت کمک واداشته؟':'What is the main reason you are seeking support?',opts:fa?['اضطراب و نگرانی','افسردگی و بی‌انگیزگی','روابط و تعارض عاطفی','هویت، مهاجرت و سازگاری فرهنگی','استرس و فرسودگی','خواب','عزت‌نفس','تروما یا تجربه دشوار','سوگ و فقدان','مشکل دیگری دارم']:['Anxiety and worry','Depression and low motivation','Relationships and emotional conflict','Identity, migration and cultural adjustment','Stress and burnout','Sleep','Self-esteem','Trauma or difficult experience','Grief and loss','Other concern']},
{key:'severity',title:fa?'در دو هفته اخیر شدت ناراحتی شما چقدر بوده؟':'How intense has your distress been over the last two weeks?',opts:fa?['کم','متوسط','زیاد','خیلی زیاد']:['Mild','Moderate','High','Very high']},
{key:'duration',title:fa?'این مشکل از چه زمانی وجود دارد؟':'How long has this concern been present?',opts:fa?['کمتر از دو هفته','چند هفته تا چند ماه','بیش از شش ماه','سال‌هاست یا عودکننده است']:['Less than 2 weeks','Weeks to a few months','More than 6 months','Years or recurrent']},
{key:'goal',title:fa?'مهم‌ترین هدفتان از درمان چیست؟':'What is your main goal?',opts:fa?['کاهش علائم','بهبود روابط','شناخت و تغییر الگوهای فکری/رفتاری','سازگاری با مهاجرت یا تغییرات زندگی','یادگیری مهارت‌های مقابله‌ای','هنوز مطمئن نیستم']:['Reduce symptoms','Improve relationships','Change thoughts/behavior patterns','Adapt to migration or life changes','Learn coping skills','Not sure yet']},
{key:'gender',title:fa?'جنسیت ترجیحی درمانگر؟':'Preferred therapist gender?',opts:fa?['مهم نیست','زن','مرد']:['No preference','Female','Male']},
{key:'language',title:fa?'زبان جلسه؟':'Session language?',opts:['فارسی','English']},
{key:'mode',title:fa?'نوع جلسه؟':'Session mode?',opts:fa?['آنلاین','حضوری','فرقی ندارد']:['Online','In-person','No preference']},
{key:'budget',title:fa?'بودجه تقریبی هر جلسه؟':'Approximate session budget?',opts:fa?['اقتصادی','متوسط','بالاتر']:['Budget','Mid-range','Higher']},
{key:'accessibility',title:fa?'آیا نیاز دسترسی‌پذیری دارید؟':'Do you need accessibility support?',opts:fa?['خیر','ناشنوا/کم‌شنوا','نابینا/کم‌بینا','هر دو']:['None','Deaf / hard of hearing','Blind / low vision','Both']}
];let cur=q[step-1];render(`<section class="card" aria-live="polite"><div class="small">${fa?'مرحله':'Step'} ${step} ${fa?'از':'of'} ${q.length}</div><h1>${cur.title}</h1><fieldset style="border:0;padding:0;margin:0"><legend class="small">${fa?'یک گزینه را انتخاب کنید':'Choose one option'}</legend>${cur.opts.map((o,i)=>`<label class="switch" style="cursor:pointer;justify-content:flex-start;gap:10px"><input type="radio" name="screen" value="${i}"> <span>${esc(o)}</span></label>`).join('')}</fieldset><button class="btn" onclick="screenNext(${step},${q.length})">${step<q.length?t('next'):(fa?'دیدن متخصصان پیشنهادی':'See recommended professionals')}</button><button class="btn ghost" onclick="${step>1?'screenPrev('+(step-1)+')':'landing()'}">${t('back')}</button></section>`);window._screenQ=q;window._screenA=a;window._screenDraw=draw}draw()}
function screenNext(step,total){let q=window._screenQ[step-1],sel=document.querySelector('input[name=screen]:checked');if(!sel){alert(fa?'لطفاً یک گزینه را انتخاب کنید.':'Please choose an option.');return}window._screenA[q.key]=q.opts[Number(sel.value)];if(step<total){window._screenDraw=(()=>{let old=window._screenDraw;return old})();// placeholder overwritten below
let qarr=window._screenQ;let next=step+1;let a=window._screenA;let draw=()=>{let cur=qarr[next-1];render(`<section class="card" aria-live="polite"><div class="small">${fa?'مرحله':'Step'} ${next} ${fa?'از':'of'} ${qarr.length}</div><h1>${cur.title}</h1><fieldset style="border:0;padding:0;margin:0"><legend class="small">${fa?'یک گزینه را انتخاب کنید':'Choose one option'}</legend>${cur.opts.map((o,i)=>`<label class="switch" style="cursor:pointer;justify-content:flex-start;gap:10px"><input type="radio" name="screen" value="${i}"> <span>${esc(o)}</span></label>`).join('')}</fieldset><button class="btn" onclick="screenNext(${next},${qarr.length})">${next<qarr.length?t('next'):(fa?'دیدن متخصصان پیشنهادی':'See recommended professionals')}</button><button class="btn ghost" onclick="screenPrev(${next-1})">${t('back')}</button></section>`)};window._screenDraw=draw;draw()}else{save('screening',window._screenA);showMatches(window._screenA)}}
function screenPrev(step){if(step<=1){screeningStart();return}let q=window._screenQ[step-1];let a=window._screenA;let cur=q;render(`<section class="card"><div class="small">${fa?'مرحله':'Step'} ${step} ${fa?'از':'of'} ${window._screenQ.length}</div><h1>${cur.title}</h1><fieldset style="border:0;padding:0;margin:0">${cur.opts.map((o,i)=>`<label class="switch" style="cursor:pointer;justify-content:flex-start;gap:10px"><input type="radio" name="screen" value="${i}" ${a[cur.key]===o?'checked':''}> <span>${esc(o)}</span></label>`).join('')}</fieldset><button class="btn" onclick="screenNext(${step},${window._screenQ.length})">${step<window._screenQ.length?t('next'):(fa?'دیدن متخصصان پیشنهادی':'See recommended professionals')}</button><button class="btn ghost" onclick="${step>1?'screenPrev('+(step-1)+')':'landing()'}">${t('back')}</button></section>`)}
function showMatches(a){let concern=a.concern||'';let scores=therapists.map(x=>{let score=0,why=[];let spec=x.spec[fa?'fa':'en'];if((concern.includes('اضطراب')||concern.includes('Anxiety'))&&spec.toLowerCase().includes('anxiety')){score+=5;why.push(fa?'تخصص در اضطراب':'anxiety specialty')}if((concern.includes('افسردگی')||concern.includes('Depression'))&&spec.toLowerCase().includes('depression')){score+=5;why.push(fa?'تخصص در افسردگی':'depression specialty')}if((concern.includes('روابط')||concern.includes('Relationships'))&&spec.toLowerCase().includes('relationship')){score+=5;why.push(fa?'تخصص در روابط':'relationship specialty')}if((concern.includes('هویت')||concern.includes('Identity'))&&spec.toLowerCase().includes('identity')){score+=5;why.push(fa?'تخصص در هویت/مهاجرت':'identity/migration specialty')}if((concern.includes('استرس')||concern.includes('Stress'))&&spec.toLowerCase().includes('stress')){score+=4;why.push(fa?'تخصص در استرس':'stress specialty')}if(a.language==='فارسی'&&x.langs.includes('فارسی')){score+=3;why.push(fa?'زبان فارسی':'Persian language')}if(a.language==='English'&&x.langs.includes('English')){score+=3;why.push('English')}if((a.mode||'').includes('آنلاین')&&x.modes.includes('online'))score+=2;if((a.mode||'').includes('Online')&&x.modes.includes('online'))score+=2;return {...x,score,why}}).sort((a,b)=>b.score-a.score);render(`<section class="card"><h1>${t('matches')}</h1><p class="p">${fa?'بر اساس غربال هدایت‌گر شما، این متخصصان بیشترین تناسب را دارند. این نتیجه تشخیص پزشکی نیست.':'Based on your guided screening, these professionals are the closest matches. This is not a clinical diagnosis.'}</p>${scores.map(x=>`<div class="therapist"><h2>${esc(x.name[fa?'fa':'en'])}</h2><p>${esc(x.spec[fa?'fa':'en'])}</p><span class="chip">${t('verified')}</span><span class="chip">${fa?'امتیاز تناسب':'Match'}: ${x.score}</span><p class="small">${x.why.length?esc(x.why.join(' • ')):(fa?'بر اساس ترجیحات عمومی شما':'Based on your general preferences')}</p><button class="btn" onclick="auth('client','signup')">${fa?'ثبت‌نام و رزرو':'Sign up & book'}</button></div>`).join('')}<button class="btn ghost" onclick="screeningStart()">${fa?'تکرار غربال':'Retake screening'}</button></section>`)}
function auth(r,mode){role=r||'client';render(`<section class="card"><h1>${mode==='login'?t('login'):t('signup')}</h1>${mode!=='login'?`<p class="p">${r==='client'?t('clientDesc'):t('therapistDesc')}</p>`:''}<label class=label>${t('email')}</label><input class=input id=email type=email autocomplete=email required>${mode!=='login'?`<label class=label>${t('name')}</label><input class=input id=name autocomplete=name><label class=label>${t('phone')}</label><input class=input id=phone inputmode=tel>`:''}<label class=label>${t('pass')}</label><input class=input id=pass type=password autocomplete=current-password><button class=btn onclick="submitAuth('${mode}')">${mode==='login'?t('login'):t('signup')}</button><button class="btn ghost" onclick="landing()">${t('back')}</button></section>`)}
function submitAuth(mode){const email=document.getElementById('email').value.trim();if(!email){alert(fa?'ایمیل را وارد کنید':'Enter your email');return}const u={email,name:document.getElementById('name')?.value||email.split('@')[0],role};save('user',u);logged=true;save('logged',true);if(role==='therapist')therapistDashboard();else home()}
function home(){if(!logged){landing();return}nav('home');const u=get('user',{});render(`<section class="card hero"><h1>${fa?'سلام':'Hello'} ${esc(u.name||'')}</h1><p class=p>${t('start')}</p><button class=btn onclick=match()>${t('find')}</button><button class="btn ghost" onclick=appointments()>${t('appointments')}</button><button class="btn ghost" onclick=journal()>${t('journal')}</button><button class="btn ghost" onclick=follow()>${t('follow')}</button></section><section class=card><h2>${t('access')}</h2><p class=p>${t('emergency')}</p></section>`)}
function match(){if(!logged){auth('client','signup');return}nav('find');render(`<section class=card><h1>${t('start')}</h1><label class=label>${t('concern')}</label><select id=concern><option value=anxiety>${fa?'اضطراب':'Anxiety'}</option><option value=depression>${fa?'افسردگی':'Depression'}</option><option value=relationship>${fa?'روابط':'Relationships'}</option><option value=identity>${fa?'هویت و مهاجرت':'Identity & Migration'}</option><option value=stress>${fa?'استرس/فرسودگی':'Stress/Burnout'}</option><option value=sleep>${fa?'خواب':'Sleep'}</option></select><label class=label>${t('lang')}</label><select id=language><option value=fa>فارسی</option><option value=en>English</option></select><label class=label>${t('gender')}</label><select id=gender><option>${t('none')}</option><option>${fa?'زن':'Female'}</option><option>${fa?'مرد':'Male'}</option></select><label class=label>${t('mode')}</label><select id=mode><option value=online>${fa?'آنلاین':'Online'}</option><option value=inperson>${fa?'حضوری':'In-person'}</option></select><label class=label>${t('distress')}</label><select id=distress><option value=low>${fa?'کم':'Low'}</option><option value=mid>${fa?'متوسط':'Moderate'}</option><option value=high>${fa?'زیاد':'High'}</option></select><label class=label>${t('budget')}</label><select id=budget><option value=35>€35–€45</option><option value=50>€50+</option></select><label class=label>${t('goal')}</label><textarea id=goal rows=3 placeholder="${fa?'هدف اصلی خود را بنویسید':'Describe your main goal'}"></textarea><label class=label>${t('accessibility')}</label><select id=acc><option value=none>${t('none')}</option><option value=deaf>${t('deaf')}</option><option value=blind>${t('blind')}</option></select><button class=btn onclick=results()>${t('matches')}</button></section>`)}
function results(){const a={concern:concern.value,language:language.value,gender:gender.value,mode:mode.value,distress:distress.value,budget:Number(budget.value),goal:goal.value,acc:acc.value};save('intake',a);let list=therapists.map(x=>{let s=0;s+=x.langs.includes(a.language==='fa'?'فارسی':'English')?4:0;s+=x.modes.includes(a.mode)?3:0;s+=x.price<=a.budget?2:0;if(a.concern==='identity'&&x.id===1)s+=4;if(a.concern==='relationship'&&x.id===3)s+=4;if((a.concern==='anxiety'||a.concern==='depression')&&x.id===2)s+=4;return {...x,score:s}}).sort((a,b)=>b.score-a.score);render(`<section class=card><h1>${t('matches')}</h1><p class=small>${t('matched')}</p>${list.map(x=>`<article class=therapist><h2>${esc(x.name[fa?'fa':'en'])} <span class=chip>✓ ${t('verified')}</span></h2><p>${esc(x.spec[fa?'fa':'en'])}</p><span class=chip>${x.langs.join(' / ')}</span><span class=chip>${t('price')}: €${x.price}</span><p class=small>${t('availability')}: ${x.times.join(' · ')}</p><button class=btn onclick="book(${x.id})">${t('book')}</button></article>`).join('')}<button class="btn ghost" onclick=match()>${t('back')}</button></section>`)}
function book(id){const x=therapists.find(z=>z.id===id);render(`<section class=card><h1>${t('book')} — ${esc(x.name[fa?'fa':'en'])}</h1><label class=label>${fa?'تاریخ':'Date'}</label><input class=input id=date type=date><label class=label>${fa?'ساعت':'Time'}</label><select id=time>${x.times.map(q=>`<option>${q}</option>`).join('')}</select><label class=label>${t('mode')}</label><select id=bmode>${x.modes.map(q=>`<option value=${q}>${q==='online'?(fa?'آنلاین':'Online'):(fa?'حضوری':'In-person')}</option>`).join('')}</select><button class=btn onclick="confirmBook(${id})">${t('book')}</button><button class="btn ghost" onclick=match()>${t('back')}</button></section>`)}
function confirmBook(id){const x=therapists.find(z=>z.id===id);const ap=get('appointments',[]);const item={id,therapist:x.name.en,date:document.getElementById('date').value||new Date().toISOString().slice(0,10),time:document.getElementById('time').value,mode:document.getElementById('bmode').value,status:'confirmed'};ap.push(item);save('appointments',ap);pushNotif(fa?'رزرو شما با موفقیت ثبت شد.':'Your appointment was confirmed.','normal');alert(fa?'رزرو ثبت شد.':'Appointment confirmed.');follow()}
function appointments(){if(!logged){auth('client','login');return}nav('follow');const a=get('appointments',[]);render(`<section class=card><h1>${t('appointments')}</h1>${a.length?a.map(x=>`<article class=therapist><b>${esc(x.therapist)}</b><p>${esc(x.date)} · ${esc(x.time)}</p><span class=chip>${esc(x.status)}</span></article>`).join(''):`<p class=p>${fa?'هنوز رزروی ندارید.':'No appointments yet.'}</p>`}<button class=btn onclick=match()>${t('book')}</button></section>`)}
function follow(){if(!logged){auth('client','login');return}nav('follow');const a=get('appointments',[]);const last=a[a.length-1];const check=get('checkins',[]).slice(-1)[0];render(`<section class=card><h1>${t('followTitle')}</h1>${last?`<div class="notice success"><b>${t('appointments')}:</b> ${esc(last.therapist)}<br>${esc(last.date)} · ${esc(last.time)}</div>`:`<div class=notice>${fa?'برای فعال شدن پیگیری، یک جلسه رزرو کنید.':'Book a session to activate follow-up.'}</div>`}<div class=therapist><h2>${t('checkin')}</h2><label class=label>${t('mood')}</label><input class=input id=mood type=number min=0 max=10 value=7><label class=label>${t('stress')}</label><input class=input id=stress type=number min=0 max=10 value=5><label class=label>${t('homework')}</label><select id=hw><option>${fa?'کامل انجام شد':'Completed'}</option><option>${fa?'نسبتاً':'Partially'}</option><option>${fa?'انجام نشد':'Not completed'}</option></select><label class=label><input type=checkbox id=contact> ${t('contact')}</label><textarea id=note rows=3 placeholder="${fa?'یادداشت اختیاری':'Optional note'}"></textarea><button class=btn onclick=submitCheckin()>${t('save')}</button>${check?`<p class=small>${fa?'آخرین چک‌این ثبت شده است.':'Latest check-in saved.'}</p>`:''}</div><div class=therapist><h2>${t('homework')}</h2><p class=p>${fa?'تمرین پیشنهادی: ثبت روزانه حال و یک اقدام کوچک متناسب با هدف درمان.':'Suggested exercise: record daily mood and one small action aligned with your treatment goal.'}</p><button class="btn ghost" onclick=completeHomework()>${t('complete')}</button></div></section>`)}
function submitCheckin(){const v={mood:Number(mood.value),stress:Number(stress.value),homework:hw.value,contact:contact.checked,note:note.value,at:new Date().toISOString()};const a=get('checkins',[]);a.push(v);save('checkins',a);if(v.mood<=3||v.stress>=8||v.contact)pushNotif(fa?'هشدار پیگیری برای درمانگر ایجاد شد.':'A therapist follow-up alert was created.','priority');else pushNotif(fa?'چک‌این ثبت شد.':'Check-in saved.','normal');alert(fa?'چک‌این ثبت شد.':'Check-in saved.');notifications()}
function completeHomework(){pushNotif(fa?'تکلیف به‌عنوان انجام‌شده ثبت شد.':'Homework marked complete.','normal');alert(fa?'ثبت شد.':'Saved.')}
function notifications(){if(!logged){auth('client','login');return}nav('alerts');const a=get('notifications',[]);a.forEach(x=>x.read=true);save('notifications',a);render(`<section class=card><h1>${t('notifications')}</h1>${a.length?a.slice().reverse().map(x=>`<div class="notice ${x.kind==='priority'?'dangerbox':''}"><b>${x.kind==='priority'?t('red'):t('green')}</b><p>${esc(x.text)}</p><span class=small>${new Date(x.at).toLocaleString()}</span></div>`).join(''):`<p class=p>${t('noNotifications')}</p>`}</section>`)}
function pushNotif(text,kind){const a=get('notifications',[]);a.push({text,kind,read:false,at:new Date().toISOString()});save('notifications',a)}
function journal(){if(!logged)return auth('client','login');render(`<section class=card><h1>${t('journal')}</h1><label class=label>${t('mood')}</label><input class=input id=jm type=number min=0 max=10 value=7><label class=label>${fa?'خواب ۰ تا ۱۰':'Sleep 0–10'}</label><input class=input id=js type=number min=0 max=10 value=7><textarea class=input id=jn rows=4 placeholder="${fa?'یادداشت امروز':'Today’s note'}"></textarea><button class=btn onclick=saveJournal()>${t('save')}</button></section>`)}
function saveJournal(){const a=get('journal',[]);a.push({mood:Number(jm.value),sleep:Number(js.value),note:jn.value,at:new Date().toISOString()});save('journal',a);alert(fa?'ثبت شد.':'Saved.');home()}
function accessibility(){render(`<section class=card><h1>♿ ${t('access')}</h1><div class=switch><span>${t('deaf')}</span><input type=checkbox ${access.deaf?'checked':''} onchange="access.deaf=this.checked;applyAccess();accessibility()"></div><div class=switch><span>${t('blind')}</span><input type=checkbox ${access.blind?'checked':''} onchange="access.blind=this.checked;applyAccess();accessibility()"></div><div class=switch><span>${t('captions')}</span><input type=checkbox ${access.captions?'checked':''} onchange="access.captions=this.checked;applyAccess()"></div><div class=switch><span>${t('large')}</span><input type=checkbox ${access.large?'checked':''} onchange="access.large=this.checked;applyAccess()"></div><div class=switch><span>${t('contrast')}</span><input type=checkbox ${access.contrast?'checked':''} onchange="access.contrast=this.checked;applyAccess()"></div><div class=switch><span>${t('focus')}</span><input type=checkbox ${access.focus?'checked':''} onchange="access.focus=this.checked;applyAccess()"></div><button class=btn onclick=readPage()>🔊 ${t('read')}</button><button class="btn ghost" onclick=voiceUI()>🎙️ ${t('voice')}</button><button class="btn ghost" onclick="logged?home():landing()">${t('back')}</button></section>`)}
function applyAccess(){document.body.classList.toggle('largeText',access.large);document.body.classList.toggle('highContrast',access.contrast);document.body.classList.toggle('focusMode',access.focus)}
function getPreferredVoice(lang){let vs=window.speechSynthesis?.getVoices?.()||[];if(lang==='fa'){return vs.find(v=>/^fa(-|_)/i.test(v.lang))||vs.find(v=>/persian|farsi/i.test(v.name+' '+v.lang))||null}return vs.find(v=>/^en(-|_)/i.test(v.lang))||null}
function speakText(text){if(!('speechSynthesis' in window)){alert(fa?'خواندن صوتی در این مرورگر در دسترس نیست. لطفاً از قابلیت متن‌خوان دستگاه استفاده کنید.':'Speech output is not available in this browser. Please use your device screen reader.');return}let lang=fa?'fa':'en';let voice=getPreferredVoice(lang);let u=new SpeechSynthesisUtterance(text);u.lang=fa?'fa-IR':'en-US';if(voice)u.voice=voice;u.rate=.9;u.pitch=1;speechSynthesis.cancel();speechSynthesis.speak(u)}
function readPage(){speakText(document.getElementById('main').innerText.slice(0,4000))}
function voiceUI(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){readPage();let c=prompt(fa?'دستور متنی: «متخصص»، «غربال»، «رزروها»، «پیگیری»، «اعلان‌ها»، «پروفایل»، «خانه»':'Text command: “therapists”, “screening”, “appointments”, “follow-up”, “alerts”, “profile”, “home”');if(c)voiceCommand(c);return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new R();r.lang=fa?'fa-IR':'en-US';r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>{document.querySelector('.logo')?.setAttribute('aria-busy','true')};r.onresult=e=>voiceCommand(e.results[0][0].transcript);r.onerror=()=>alert(fa?'تشخیص گفتار فارسی یا دسترسی میکروفون در این مرورگر در دسترس نیست؛ از دکمه‌های متنی استفاده کنید.':'Speech recognition or microphone access is unavailable; use the text controls.');r.onend=()=>document.querySelector('.logo')?.removeAttribute('aria-busy');try{r.start()}catch(e){alert(fa?'شروع دستیار صوتی ممکن نشد؛ از کنترل متنی استفاده کنید.':'Voice assistant could not start; use text controls.')}}
function voiceCommand(c){c=c.toLowerCase();if(c.includes('غربال')||c.includes('screen'))screeningStart();else if(c.includes('درمان')||c.includes('متخصص')||c.includes('therap'))professionalDirectory();else if(c.includes('رزرو')||c.includes('appointment'))appointments();else if(c.includes('پیگیری')||c.includes('follow'))follow();else if(c.includes('اعلان')||c.includes('alert'))notifications();else if(c.includes('پروفایل')||c.includes('profile'))profile();else if(c.includes('دسترسی')||c.includes('access'))accessibility();else home()}
function profile(){if(!logged)return landing();nav('profile');const u=get('user',{});render(`<section class=card><h1>${t('profile')}</h1><p><b>${esc(u.name)}</b></p><p class=small>${esc(u.email)}</p><button class=btn onclick=accessibility()>♿ ${t('access')}</button><button class="btn ghost" onclick=membership()>${t('membership')}</button>${u.role==='therapist'?`<button class="btn ghost" onclick=therapistDashboard()>${t('dashboard')}</button>`:''}<button class="btn danger" onclick=logout()>${t('logout')}</button></section>`)}
function membership(){render(`<section class=card><h1>${t('membership')}</h1><div class=therapist><h2>Free</h2><p class=p>${fa?'حساب، ارزیابی اولیه و پیدا کردن درمانگر':'Account, intake and therapist discovery'}</p></div><div class=therapist><h2>Premium</h2><p class=p>${fa?'پیگیری پیشرفته، دفتر حال و تکلیف':'Enhanced follow-up, mood journal and homework'}</p><button class=btn onclick="alert('${fa?'پرداخت واقعی هنوز به درگاه متصل نشده است.':'Live payment is not connected yet.'}')">${fa?'انتخاب':'Choose'}</button></div><button class="btn ghost" onclick=profile()>${t('back')}</button></section>`)}
function therapistDashboard(){if(!logged)return landing();nav('profile');const cs=get('checkins',[]);const alerts=cs.filter(x=>x.mood<=3||x.stress>=8||x.contact).length;render(`<section class=card><h1>${t('dashboard')}</h1><div class=statgrid><div class=stat><b>${get('appointments',[]).length}</b>${t('appointments')}</div><div class=stat><b>${cs.length}</b>${t('checkin')}</div><div class=stat><b>${alerts}</b>${t('alertsTitle')}</div><div class=stat><b>0</b>${t('clients')}</div></div><div class="notice dangerbox"><b>${t('red')}</b><p>${alerts? (fa?'مراجعانی نیازمند بررسی در چک‌این وجود دارند.':'Clients require review based on check-in signals.') : (fa?'هشدار اولویت‌دار فعالی نیست.':'No priority alerts are active.')}</p></div><button class=btn onclick=notifications()>${t('alerts')}</button><button class="btn ghost" onclick=profile()>${t('back')}</button></section>`)}
function logout(){logged=false;role='';localStorage.removeItem('luma_logged');landing()}
function toggleLang(){fa=!fa;document.getElementById('langBtn').textContent=fa?'EN':'FA';if(logged){const u=get('user',{});u.role==='therapist'?therapistDashboard():home()}else landing()}
if('speechSynthesis' in window && speechSynthesis.onvoiceschanged!==undefined){speechSynthesis.onvoiceschanged=()=>{};} logged=!!get('logged',false);role=get('user',{}).role||'';applyAccess();logged?home():landing();
</script></body></html>
